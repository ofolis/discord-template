permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  main-ci:
    name: Main CI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - continue-on-error: true
        name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - continue-on-error: true
        name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Run linting processes
        run: npm run lint
      - name: Run type checking
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build

name: Main Commit
