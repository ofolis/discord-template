name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recovery_version:
        description: "Existing semantic version to recover, for example 1.2.3"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release commit
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/main-commit.yaml
    permissions:
      contents: read

  activation:
    name: Validate release activation
    if: github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.activation.outputs.allowed }}
    env:
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "24.10"
      - id: activation
        name: Inspect activation authorization
        shell: bash
        run: |
          set +e
          output="$(npm run --silent validate:release-activation 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          allowed="$(printf '%s\n' "$output" | awk -F= '$1 == "RELEASE_ALLOWED" { print $2; exit }')"
          if [ "$allowed" != "true" ]; then
            echo "Release publication is disabled; this workflow will complete without publishing."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release and image
    needs: activation
    if: github.ref == 'refs/heads/main' && needs.activation.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "24.10"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.recovery_version == ''
        name: Install isolated release tooling
        shell: bash
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/semantic-release" \
            --no-save \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            semantic-release@25.0.9 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.1 \
            @semantic-release/github@12.0.11 \
            conventional-changelog-conventionalcommits@7.0.2
      - if: inputs.recovery_version == ''
        name: Verify isolated release tooling
        shell: bash
        env:
          RELEASE_TOOLING_DIR: ${{ runner.temp }}/semantic-release
        run: node scripts/verify-release-tooling.mjs
      - if: inputs.recovery_version == ''
        name: Run semantic-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/semantic-release/node_modules/.bin/semantic-release"
      - if: inputs.recovery_version != ''
        name: Recover existing release identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: node scripts/recover-release.mjs
